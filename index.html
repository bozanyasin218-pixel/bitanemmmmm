<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sonsuz Aşkım</title>
    <style>
        body {
            background: linear-gradient(135deg, #0d0006 0%, #000000 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            perspective: 1000px;
        }

        /* 🌌 Arka Planda Uçuşan Kalpler */
        .background-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            bottom: -50px;
            opacity: 0;
            animation: floatUp 6000ms linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            15% { opacity: 0.6; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-105vh) translateX(100px) scale(1.2); opacity: 0; }
        }

        /* ❤️ Ortadaki Büyük Kalp Kutusu */
        .heart-container {
            position: relative;
            width: 320px;
            height: 320px;
            z-index: 5;
            transform-style: preserve-3d;
            animation: pulseHeart 3000ms infinite ease-in-out; 
            margin-bottom: 40px; /* Kalp ve altındaki yazı arasına boşluk bırakır */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .love-line {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #ff75a0;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff2a74;
            white-space: nowrap;
            transform-origin: center center;
        }

        /* ✍️ Kalbin Altına ve Butonun Üstüne Taşınan Yeni Yazı Alanı */
        .romantic-text-box {
            z-index: 10;
            text-align: center;
            width: 100%;
            margin-bottom: 20px; /* Butonla arasındaki boşluk */
            min-height: 40px;
        }

        .romantic-text {
            color: #fff;
            font-size: 1.4rem; 
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 117, 160, 0.8);
            border-right: 2px solid #ff75a0;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: typing 4000ms steps(40, end) infinite alternate, blink-caret 0.75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #ff75a0; } }

        /* 🎵 Müzik Çalar */
        .music-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 117, 160, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 117, 160, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .music-box audio {
            height: 28px;
            width: 200px;
            outline: none;
        }

        /* 🔘 Etkileşimli Romantik Buton */
        .love-button {
            z-index: 10;
            background: linear-gradient(45deg, #ff2a74, #ff75a0);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 116, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .love-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 42, 116, 0.9);
        }
    </style>
</head>
<body>

    <div class="music-box">
        <audio id="myAudio" controls loop>
            <source src="https://soundhelix.com" type="audio/mpeg">
        </audio>
    </div>

    <div class="background-hearts"></div>
    
    <!-- Kalp artık tamamen boş ve üstte -->
    <div class="heart-container"></div>

    <!-- Daktilo yazısı kalbin alt tarafında butonun hemen üzerinde -->
    <div class="romantic-text-box">
        <div class="romantic-text" id="dynamic-love-text"></div>
    </div>

    <button class="love-button" onclick="loveClick()">Beni Ne Kadar Seviyorsun? ❤️</button>

    <script>
        // Mesaj listesi
        const dillerdekiMesajlar = [
            "Sonsuza dek sadece sen... 🇹🇷",
            "Only you forever... 🇬🇧",
            "Seulement toi pour toujours... 🇫🇷",
            "Sólo tú para siempre... 🇪🇸",
            "Solo tu per sempre... 🇮🇹",
            "Für immer nur du... 🇩🇪"
        ];

        const rastgeleMesaj = dillerdekiMesajlar[Math.floor(Math.random() * dillerdekiMesajlar.length)];
        document.getElementById('dynamic-love-text').innerText = rastgeleMesaj;

        // Büyük Kalp Oluşturma
        const heartContainer = document.querySelector('.heart-container');
        const totalLines = 65;
        for (let i = 0; i < totalLines; i++) {
            let angle = (i / totalLines) * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(angle), 3) * 12;
            let y = -(13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle)) * 12;
            const div = document.createElement('div');
            div.className = 'love-line';
            div.innerText = 'I love you';
            div.style.transform = `translate3d(${x}px, ${y}px, 0px) rotateZ(${angle * (180 / Math.PI) - 90}deg)`;
            heartContainer.appendChild(div);
        }

        // Uçuşan Kalpler
        const bgContainer = document.querySelector('.background-hearts');
        const heartEmojis = ['❤️', '💖', '💝', '💕'];
        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 4000 + 4000;
            heart.style.animationDuration = duration + 'ms';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            bgContainer.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration);
        }
        setInterval(createBackgroundHeart, 300);

        // Buton Mesajları ve Müzik Tetikleyicisi
        const mesajlar = [
            "Seni gökyüzündeki yıldızlar kadar çok seviyorum! ✨",
            "Kalbimin tek sahibi sensin! 💖",
            "Her günüm seninle daha güzel... 🌹",
            "Sonsuza kadar sadece sen ve ben! 🔒❤️"
        ];
        let sayac = 0;
        
        function loveClick() {
            const audio = document.getElementById('myAudio');
            if (audio) {
                audio.play().catch(function(error) {
                    console.log("Müzik otomatik başlatılamadı.");
                });
            }
            
            alert(mesajlar[sayac % mesajlar.length]);
            sayac++;
        }
    </script>
</body>
</html>
